# =====================================================================
# AlmaLinux 8.9 + Cisco ENCS 5412 Marvell switch bootstrap
# Built from Cisco_NFVIS-4.15.5-FC4.iso  (kernel 4.18.0-513.18.2.el8_9)
#
# Works as:
#   - a Proxmox/KVM guest with 0d:00.0 (11ab:be00) passed through
#   - a bare-metal install on the ENCS 5412 itself
#
# The %post auto-detects which case it is.
# =====================================================================

text
eula --agreed
firstboot --disable
lang en_US.UTF-8
keyboard us
timezone UTC --utc

# --- authentication -------------------------------------------------
# CHANGE THIS. Placeholder password is: encs
rootpw --plaintext encs
selinux --permissive
firewall --disabled
# NB: do NOT list marvell-switch-boot here.  Anaconda applies `services`
# during configuration, BEFORE %post - and %post is what copies the unit file
# off the ISO.  Enabling a unit that does not exist yet aborts the install with
# "DBusError: Error enabling service marvell-switch-boot: 1".
# %post enables it after installing the unit.
services --enabled=sshd,NetworkManager,chronyd

# --- install source: this ISO ---------------------------------------
# NOT `cdrom`.  Anaconda's cdrom source setup discovers the repo via
# .treeinfo, which this ISO does not have (neither does Cisco's) - that
# yields "Error setting up software source" and drops to an interactive
# prompt.  `harddrive` names the repo directory explicitly instead, which
# is exactly what Cisco's own ks.cfg does:
#     harddrive --partition=/dev/disk/by-label/NFVIS4155 --dir=/
harddrive --partition=/dev/disk/by-label/ENCS_SW_89 --dir=/

# --- disk -----------------------------------------------------------
# WARNING: erases the selected disk.
#
# Anaconda requires EVERY disk named in `ignoredisk --only-use` to exist, so a
# hardcoded list like "sda,vda,nvme0n1" is fatal anywhere not all three are
# present (a virtio VM has only vda; the ENCS M.2 shows up as sda or nvme0n1).
# The %pre block below detects the real disk and writes /tmp/disk.ks.
zerombr
%include /tmp/disk.ks

# --- network --------------------------------------------------------
# DHCP on the first NIC so the box is reachable after install.
network --bootproto=dhcp --device=link --activate --hostname=encs-switch

reboot --eject

# =====================================================================
# Detect the install disk at runtime and emit the partitioning directives.
# Runs before %include /tmp/disk.ks is evaluated.
%pre --interpreter=/bin/bash --log=/tmp/ks-pre.log
DISK=""
for cand in $(lsblk -dn -o NAME,TYPE 2>/dev/null | awk '$2=="disk"{print $1}'); do
    case "$cand" in loop*|sr*|ram*|zram*|fd*) continue ;; esac
    DISK="$cand"; break
done
# Fall back to whatever /sys says if lsblk was unhelpful.
if [ -z "$DISK" ]; then
    for cand in nvme0n1 vda sda hda; do
        [ -b "/dev/$cand" ] && { DISK="$cand"; break; }
    done
fi
echo "selected install disk: ${DISK:-NONE}"
cat > /tmp/disk.ks <<EOF
ignoredisk --only-use=$DISK
clearpart --all --initlabel --drives=$DISK
autopart --type=lvm --nohome
bootloader --location=mbr --boot-drive=$DISK --timeout=5 --append="console=tty0 console=ttyS0,9600n8"
EOF
%end

# =====================================================================
%packages --excludedocs --ignoremissing
# NOTE: we deliberately do NOT use @core.  Cisco redefined the 'core' comps
# group on this ISO to include the whole NFVIS platform - cisco-esc-lite
# (189MB), confd, cosign, java, nodejs, etcd, kubectl, openvswitch.  Pulling
# @core would drag ~300MB of Cisco stack into a bootstrap VM that needs none
# of it.  So the base is enumerated explicitly instead.
basesystem
filesystem
setup
rootfiles
bash
glibc
glibc-common
glibc-langpack-en
systemd
systemd-udev
rpm
dnf
yum
coreutils
util-linux
procps-ng
iproute
iputils
kernel
kernel-core
kernel-modules
dracut
dracut-config-generic
dracut-network
grub2-common
grub2-efi-x64
grub2-pc
grub2-pc-modules
grub2-tools
grub2-tools-minimal
grub2-tools-extra
shim-x64
efibootmgr
lvm2
e2fsprogs
xfsprogs
parted
NetworkManager
NetworkManager-team
openssh-server
openssh-clients
chrony
sudo
passwd
shadow-utils
authselect
selinux-policy-targeted
policycoreutils
audit
dbus
kbd
hostname
ca-certificates
curl
tar
xz
gzip
bzip2
less
vim-minimal
platform-python
dmidecode
pciutils
kmod
which
findutils
gawk
sed
grep
rsyslog
cronie
crontabs
tuned
firewalld
iptables
# ENCS switch bootstrap + NIC drivers.
# nfvis-fwupdate is deliberately NOT installed - it flashes BIOS/CIMC.
switch-confd
nic-xl710-i350
%end

# =====================================================================
# Copy the runtime payload into the target BEFORE the chroot %post runs.
# This MUST be --nochroot: /run/install/repo is the installer's own mount and
# does not exist inside the chroot, so copying from there in the chroot %post
# silently does nothing - the system boots fine and the switch never starts.
%post --nochroot --log=/mnt/sysimage/root/ks-post-nochroot.log
set -o pipefail
if [ -d /run/install/repo/encs ]; then
    cp -a /run/install/repo/encs/. /mnt/sysimage/
    echo "runtime payload copied into /mnt/sysimage"
    ls -l /mnt/sysimage/etc/systemd/system/marvell-switch-boot.service \
          /mnt/sysimage/usr/local/sbin/encs-switch-status \
          /mnt/sysimage/usr/local/sbin/encs-switch-api
else
    echo "ERROR: /run/install/repo/encs not found on the install media" >&2
fi
%end

# =====================================================================
%post --interpreter=/usr/bin/bash --log=/root/ks-post.log
set -o pipefail

echo "### ENCS switch bootstrap post-install ###"

# ---------------------------------------------------------------
# 1. PIN THE KERNEL.  The Marvell module is built for exactly
#    4.18.0-513.18.2.el8_9 (vermagic + modversions CRCs).  A kernel
#    update silently breaks the switch with no obvious symptom.
# ---------------------------------------------------------------
echo "8.9" > /etc/yum/vars/releasever
for f in /etc/dnf/dnf.conf /etc/yum.conf; do
    [ -f "$f" ] || continue
    grep -q '^exclude=' "$f" && sed -i 's/^exclude=.*/exclude=kernel* redhat-release* almalinux-release*/' "$f" \
                             || echo 'exclude=kernel* redhat-release* almalinux-release*' >> "$f"
done
echo "kernel pinned to $(uname -r 2>/dev/null || echo 4.18.0-513.18.2.el8_9)"

# ---------------------------------------------------------------
# 1b. Fix up the runtime payload copied in by the --nochroot %post.
#     (The copy MUST happen there: /run/install/repo is the installer's
#     own mount and is NOT visible inside this chroot.)
# ---------------------------------------------------------------
if [ -f /etc/systemd/system/marvell-switch-boot.service ]; then
    chmod 0755 /usr/local/sbin/encs-switch-* 2>/dev/null || true
    chmod 0644 /etc/systemd/system/marvell-switch-boot.service
    # Host-side bundle: meant to be copied to the hypervisor, not run here.
    chmod 0755 /opt/encs-host/*.sh 2>/dev/null || true
    echo "runtime payload present:"
    ls -1 /usr/local/sbin/encs-switch-* /opt/encs-host/ 2>/dev/null | sed 's/^/    /'
else
    echo "ERROR: runtime payload missing - the --nochroot %post did not run" >&2
fi

# ---------------------------------------------------------------
# 2. Make sure the bootstrap is enabled even if switch-confd's own
#    RPM scriptlet bailed out.  That scriptlet gates on
#    'dmidecode -s system-product-name' matching ENCS54xx/CSX-, which
#    fails inside a VM that has no SMBIOS override at install time.
# ---------------------------------------------------------------
systemctl enable marvell-switch-boot.service || true

# The ConfD-based management daemons are NOT usable standalone
# (they import _confd, which we do not ship).  Disable them so they
# do not fail noisily on every boot.
systemctl disable switch-confd.service  2>/dev/null || true
systemctl disable switch-service.service 2>/dev/null || true
chkconfig --del remote-bootd 2>/dev/null || true

# ---------------------------------------------------------------
# 3. Cisco's forked igb/i40e.  igb carries the def_media logic that
#    makes the G0/G1 RJ45 jacks work (the I350s are the fiber part).
#    Only meaningful on bare metal; harmless in a VM.
# ---------------------------------------------------------------
KVER=$(ls /lib/modules | head -1)
if [ -d /opt/nic-pkg ]; then
    for m in igb i40e; do
        src="/opt/nic-pkg/${m}.ko.xz"
        dst="/lib/modules/${KVER}/kernel/drivers/net/ethernet/intel/${m}/"
        if [ -f "$src" ] && [ -d "$dst" ]; then
            cp -f "$src" "$dst" && echo "installed Cisco ${m}.ko.xz"
        fi
    done
    depmod -a "$KVER" || true
fi

# ---------------------------------------------------------------
# ---------------------------------------------------------------
# 4. Switch management network - NOT configured here, deliberately.
#
#    The switch answers on 169.254.1.0 over VLAN 2363 on the X710
#    backplane, and that NIC belongs to the HYPERVISOR, not this VM.
#    Earlier builds wrote ifcfg-int-LAN* here; they were inert and
#    actively misleading, implying the VM could reach the switch.
#    It cannot - the VM only boots the ASIC over PCIe.
#
#    Host-side setup ships in /opt/encs-host/. Copy it to the
#    hypervisor and run install.sh there.
# ---------------------------------------------------------------
chmod 0755 /opt/encs-host/install.sh 2>/dev/null || true
# EXPERIMENTAL: the ESXi counterpart. Same idea, a different hypervisor -
# except that ESXi cannot run the tools at all, so on that platform they stay
# in this VM and only passthrough + networking go to the host. docs/ESXI.md.
chmod 0755 /opt/encs-esxi/*.sh /opt/encs-esxi/encs-esxi-vnet 2>/dev/null || true
echo "169.254.1.0 switch" >> /etc/hosts

# ---------------------------------------------------------------
# 5. Banner so whoever logs in knows what this box is.
# ---------------------------------------------------------------
cat > /etc/motd <<'EOF'

  ENCS 5412 Marvell switch bootstrap  (AlmaLinux 8.9, kernel pinned)

  THIS VM ONLY BOOTS THE SWITCH ASIC over PCIe. It does not carry switch
  traffic and cannot reach the switch's management IP - that lives on the
  hypervisor's X710 backplane.

    encs-switch-status              bootstrap health check
    journalctl -u marvell-switch-boot -f     live bootstrap log

  DO NOT restart marvell-switch-boot, and avoid stopping this VM.
  The loader can only bootstrap an ASIC that is in WFI. Re-running it against
  a running switch wedges it, and recovery needs PHYSICAL AC REMOVAL -
  CIMC power-off is NOT enough. A wedged loader does not mean a dead switch:
  check with 'ping 169.254.1.0' from the hypervisor.

  Do NOT update the kernel. The Marvell module is built for
  4.18.0-513.18.2.el8_9 only.

  Hypervisor setup + switch management tools:  /opt/encs-host/
    copy that directory to Proxmox and run install.sh there,
    then use encs-switch-tui.

  On ESXi (EXPERIMENTAL) it works the other way round: /opt/encs-esxi/ goes
  to the host for passthrough and networking, and the tools above run HERE,
  over a second vNIC on VLAN 2363. See docs/ESXI.md.

EOF
echo "### post-install complete ###"
%end
