# A 21 MB initramfs instead of dracut-config-generic's 62 MB.
#
# Why it matters: with a passthrough device both Proxmox and ESXi pin the
# VM's whole allocation, and the generic image is what sets the floor - below
# ~300 MB GRUB fails with "can't allocate initrd" before the kernel runs.
# Measured 2026-09-03: under ESXi's firmware this image boots and bootstraps
# the ASIC at 256 MB (the generic one needs 320). Proxmox's OVMF cannot place
# the kernel below 384 regardless, so there the VM runs under SeaBIOS (the
# image carries a BIOS GRUB too) and gets the same 256.
#
# Still generic (hostonly="no"): the image is built under QEMU (virtio) and
# deployed on Proxmox (virtio) or ESXi (pvscsi, vmxnet3), so every storage
# and NIC driver stays in. What goes: firmware blobs (a VM's virtual devices
# load none; ~25 MB was Netronome NIC firmware alone), network boot, remote
# storage, RAID, encryption, hibernation, plymouth. LVM and device-mapper
# stay - the root is on LVM, and omitting "dm" lands you in the dracut
# emergency shell.
hostonly="no"
compress="xz"
fw_dir="/nonexistent"
omit_dracutmodules+=" network network-legacy network-manager nfs iscsi fcoe fcoe-uefi nbd cifs multipath nvdimm nvmf plymouth crypt mdraid dmraid btrfs lunmask qemu qemu-net kernel-network-modules kernel-modules-extra biosdevname memstrack rngd resume i18n "
